---
- name: Configure basic profile linux roles
  hosts: basic
  become: true

  vars:
    ansible_user: "{{ my_ansible_user }}"
    desktop_user_names: "{{ desktop_users | map(attribute='name') | list }}"

  roles:
    - podman
    - tmux
    - ruby
    - python
    - dolt_sql_server
    - rtk
    - beads_go
    - beads_viewer
    - specify_cli
    - nodejs
    - ai_agent_workspace
    - claude_code
    - opencode
    - github_cli

- name: Configure desktop profile linux roles
  hosts: desktop
  become: true

  vars:
    ansible_user: "{{ my_ansible_user }}"
    desktop_user_names: "{{ desktop_users | map(attribute='name') | list }}"

  # The basic and desktop plays share 8 roles verbatim (podman, ruby, python,
  # claude_code, opencode, tmux, dolt_sql_server, github_cli); desktop
  # additionally adds nerd_font, google_chrome, and obsidian (FR-004) — an
  # accepted Principle II/XI (role-organisation/DRY) exception, logged in
  # plan.md Complexity Tracking. The desktop group is the switch; no when:
  # needed (FR-012).
  roles:
    - podman
    - ruby
    - python
    - rtk
    - beads_go
    - beads_viewer
    - specify_cli
    - nodejs
    - ai_agent_workspace
    - claude_code
    - opencode
    - tmux
    - nerd_font
    - dolt_sql_server
    - github_cli
    - role: google_chrome
      tags: not-supported-on-arm64
    - role: obsidian
      tags: not-supported-on-arm64
