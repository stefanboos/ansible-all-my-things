---
- name: Install git
  ansible.builtin.apt:
    name:
      - git
    state: present
  become: true

# -----
# Install beads issue tracker (bd) from the gastownhall/beads GitHub release
#
# Direct-download + Ansible-native checksum verification replaces the previous
# blind installer-script approach: get_url fetches the release checksums.txt
# and fails atomically (no partial file left) if the archive hash does not
# match. The version is frozen at whatever release is present on first install
# and does not auto-upgrade. System-wide install (single scalar stat gate,
# matching rtk) rather than per-user: bd is a static per-architecture binary
# with no per-user state (issue/config data lives in ~/.beads or project dirs
# regardless of binary location).
# -----

- name: Check if bd binary already exists
  ansible.builtin.stat:
    path: /usr/local/bin/bd
  register: bd_stat

- name: Install bd from a checksum-verified release archive
  when: not bd_stat.stat.exists
  become: true
  block:
    - name: Verify supported processor architecture for bd
      ansible.builtin.assert:
        that: "ansible_facts['architecture'] in beads_platform_map"
        fail_msg: >
          Unsupported processor architecture: {{ ansible_facts['architecture'] }}.
          Supported architectures are: {{ beads_platform_map.keys() | list }}.

    # beads_bd_version is a static pin (roles/beads/defaults/main.yml),
    # refreshed only by playbooks/update-versions/perform-updates.yml -- see
    # Constitution Principle II. The stripped filename-variant is still
    # derived in-role from the single pinned raw tag.
    - name: Derive stripped bd version from pinned tag
      ansible.builtin.set_fact:
        bd_version: "{{ beads_bd_version | regex_replace('^v', '') }}"

    - name: Download and checksum-verify bd archive
      ansible.builtin.get_url:
        url: https://github.com/gastownhall/beads/releases/download/{{ beads_bd_version }}/beads_{{ bd_version }}_linux_{{ beads_platform_map[ansible_facts['architecture']] }}.tar.gz
        dest: /tmp/beads_{{ bd_version }}_linux_{{ beads_platform_map[ansible_facts['architecture']] }}.tar.gz
        checksum: "sha256:{{ (beads_bd_sha256_amd64 if ansible_facts['architecture'] == 'x86_64' else beads_bd_sha256_arm64) }}"
        mode: '0644'

    - name: Extract bd binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/beads_{{ bd_version }}_linux_{{ beads_platform_map[ansible_facts['architecture']] }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        mode: '0755'
        include:
          - bd

# -----
# Install beads viewer (bv) from the Dicklesworthstone/beads_viewer GitHub
# release
#
# beads_viewer publishes an aggregate checksums.txt (sha256sum format), same
# shape as bd -- verified via get_url's native checksum: URL param. Archive
# filenames are version-agnostic (e.g. bv_linux_amd64.tar.gz). Same
# frozen-at-first-install, no-partial-file, system-wide semantics as bd.
# -----

- name: Check if bv binary already exists
  ansible.builtin.stat:
    path: /usr/local/bin/bv
  register: bv_stat

- name: Install bv from a checksum-verified release archive
  when: not bv_stat.stat.exists
  become: true
  block:
    - name: Verify supported processor architecture for bv
      ansible.builtin.assert:
        that: "ansible_facts['architecture'] in beads_platform_map"
        fail_msg: >
          Unsupported processor architecture: {{ ansible_facts['architecture'] }}.
          Supported architectures are: {{ beads_platform_map.keys() | list }}.

    # beads_bv_version is a static pin (roles/beads/defaults/main.yml),
    # refreshed only by playbooks/update-versions/perform-updates.yml -- no
    # stripping needed anywhere, bv's filename is version-agnostic.
    - name: Download and checksum-verify bv archive
      ansible.builtin.get_url:
        url: https://github.com/Dicklesworthstone/beads_viewer/releases/download/{{ beads_bv_version }}/bv_linux_{{ beads_platform_map[ansible_facts['architecture']] }}.tar.gz
        dest: /tmp/bv_linux_{{ beads_platform_map[ansible_facts['architecture']] }}.tar.gz
        checksum: "sha256:{{ (beads_bv_sha256_amd64 if ansible_facts['architecture'] == 'x86_64' else beads_bv_sha256_arm64) }}"
        mode: '0644'

    - name: Extract bv binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/bv_linux_{{ beads_platform_map[ansible_facts['architecture']] }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        mode: '0755'
        include:
          - bv

- name: Clone beads source repository
  ansible.builtin.git:
    repo: https://github.com/gastownhall/beads.git
    dest: /home/{{ item }}/Documents/Cline/beads
    version: main
    update: yes
    force: no
  become: true
  become_user: "{{ item }}"
  loop: "{{ desktop_user_names }}"
