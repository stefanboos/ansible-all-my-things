---
- name: Check if node binary already exists
  ansible.builtin.stat:
    path: /usr/local/bin/node
  register: node_stat

- name: Install Node.js LTS from a checksum-verified release archive
  when: not node_stat.stat.exists
  become: true
  block:
    - name: Verify supported processor architecture
      ansible.builtin.assert:
        that: "ansible_facts['architecture'] in node_platform_map"
        fail_msg: >
          Unsupported processor architecture: {{ ansible_facts['architecture'] }}.
          Supported architectures are: {{ node_platform_map.keys() | list }}.

    - name: Get Node.js release index
      ansible.builtin.uri:
        url: https://nodejs.org/dist/index.json
        validate_certs: true
        return_content: true
      register: node_index

    - name: Resolve latest Node.js LTS versions
      ansible.builtin.set_fact:
        node_lts_versions: "{{ node_index.json | selectattr('lts') | map(attribute='version') | list }}"

    - name: Assert a Node.js LTS version was resolved
      ansible.builtin.assert:
        that: "node_lts_versions | length > 0"
        fail_msg: >
          No LTS entry found in https://nodejs.org/dist/index.json -- cannot
          resolve a Node.js version to install.

    - name: Extract latest Node.js LTS version
      ansible.builtin.set_fact:
        node_version: "{{ node_lts_versions[0] }}"

    - name: Download and checksum-verify the Node.js release archive
      ansible.builtin.get_url:
        url: "https://nodejs.org/dist/{{ node_version }}/node-{{ node_version }}-linux-{{ node_platform_map[ansible_facts['architecture']] }}.tar.gz"
        dest: "/tmp/node-{{ node_version }}-linux-{{ node_platform_map[ansible_facts['architecture']] }}.tar.gz"
        checksum: "sha256:https://nodejs.org/dist/{{ node_version }}/SHASUMS256.txt"
        mode: '0644'

    - name: Ensure /usr/local/lib/nodejs exists
      ansible.builtin.file:
        path: /usr/local/lib/nodejs
        state: directory
        mode: '0755'

    - name: Extract the verified Node.js archive
      ansible.builtin.unarchive:
        src: "/tmp/node-{{ node_version }}-linux-{{ node_platform_map[ansible_facts['architecture']] }}.tar.gz"
        dest: /usr/local/lib/nodejs
        remote_src: true

    - name: Symlink Node.js binaries into /usr/local/bin
      ansible.builtin.file:
        src: "/usr/local/lib/nodejs/node-{{ node_version }}-linux-{{ node_platform_map[ansible_facts['architecture']] }}/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
      loop:
        - node
        - npm
        - npx
        - corepack

- name: Install frequently used global npm packages
  ansible.builtin.shell: |
    npm install --global --prefix /usr/local \
      eslint \
      markdownlint-cli \
      prettier \
      typescript
  # Explicit --prefix /usr/local makes the install location deterministic
  # regardless of the /usr/local/bin/npm symlink's real target, and matches
  # the last package (typescript) used in the creates: check below.
  args:
    executable: /bin/bash
    creates: /usr/local/lib/node_modules/typescript
  become: true
